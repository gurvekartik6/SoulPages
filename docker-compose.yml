version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: booktracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: booktracker
      POSTGRES_USER: booktracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file before running}
    volumes:
      - booktracker_pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booktracker -d booktracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: booktracker-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://booktracker:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file before running}@postgres:5432/booktracker
      PGSSL: "false" # container-to-container traffic on the compose network doesn't need TLS
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file before running}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5000"

  frontend:
    build: ./frontend
    container_name: booktracker-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  booktracker_pgdata:
